services:
  - type: web
    name: library-management-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn library_project.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
databases:
  - name: library-db
